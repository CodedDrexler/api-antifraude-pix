# Use with -p bootcamp-untrust-check and API_PORT=18001 for a separate test database/network.
services:
  api:
    image: bootcamp-api:latest
    environment:
      DATABASE_URL: postgresql+psycopg2://pix:pix@db:5432/pix
      GNN_MODE: shadow
  tests:
    image: bootcamp-tests:latest
    environment:
      PIX_TEST_DATABASE_URL: postgresql+psycopg2://pix:pix@db:5432/pix

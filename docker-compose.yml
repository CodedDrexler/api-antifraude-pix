services:
  api:
    build:
      context: .
      target: api
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://pix:pix@db:5432/pix}
      GNN_MODE: ${GNN_MODE:-shadow}
      GNN_MODEL_PATH: /app/models/gnn-synthetic-v1.json
      GNN_V2_MODE: ${GNN_V2_MODE:-shadow}
      GNN_V2_MODEL_PATH: ${GNN_V2_MODEL_PATH:-/app/models/gnn-directed-temporal-v2-seed-42.json}
      RISK_POLICY_PATH: /app/config/risk-policy.json
      ENTITY_RISK_MODE: ${ENTITY_RISK_MODE:-shadow}
      ENTITY_REGISTRY_PATH: ${ENTITY_REGISTRY_PATH:-}
    volumes:
      - ./config/risk-policy.json:/app/config/risk-policy.json:ro
      - ./config/entity-registry.json:/app/config/entity-registry.json:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 3s
      timeout: 6s
      retries: 20
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pix
      POSTGRES_PASSWORD: pix
      POSTGRES_DB: pix
    volumes:
      - pix_data:/var/lib/postgresql/data
      - ./database/database.sql:/docker-entrypoint-initdb.d/001_pix.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pix -d pix"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  tests:
    profiles: [test]
    build:
      context: .
      target: test
    environment:
      PIX_API_URL: http://api:8000
      PIX_TEST_DATABASE_URL: postgresql+psycopg2://pix:pix@db:5432/pix
    depends_on:
      api:
        condition: service_healthy
  gnn-training:
    profiles: [gnn]
    build:
      context: .
      target: gnn-training
    volumes:
      - ./models:/app/models
volumes:
  pix_data:

services:
  api:
    build:
      context: .
      target: api
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://pix:pix@db:5432/pix
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-default_token}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 3s
      timeout: 6s
      retries: 20
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pix
      POSTGRES_PASSWORD: pix
      POSTGRES_DB: pix
    volumes:
      - pix_data:/var/lib/postgresql/data
      - ./database/database.sql:/docker-entrypoint-initdb.d/001_pix.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pix -d pix"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  tests:
    profiles: [test]
    build:
      context: .
      target: test
    environment:
      PIX_API_URL: http://api:8000
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-default_token}
    depends_on:
      api:
        condition: service_healthy
volumes:
  pix_data:
